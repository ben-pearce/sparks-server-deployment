name: coder
services:
  coder:
    image: ghcr.io/coder/coder:2.34.14@sha256:a31f166c43d2dc8d68c49e345915f605999fe40791d40b67556745da504a9e6e
    container_name: coder
    depends_on:
      coder-postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}/coder:/home/coder
    environment:
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: 'https://coder.${HOST}'
      CODER_OIDC_IGNORE_EMAIL_VERIFIED: true
      CODER_DISABLE_PASSWORD_AUTH: true
      CODER_OIDC_SCOPES: openid,profile,email,offline_access
      CODER_OIDC_ISSUER_URL: ${AUTHENTIK_HOST}/application/o/coder/
      CODER_WILDCARD_ACCESS_URL: '*.coder.${HOST}'
    env_file:
      - ../.secrets/coder
    restart: unless-stopped
    labels:
      readme.description: Secure environments for developers and their agents
      readme.links.github: https://github.com/coder/coder
      traefik.enable: true
      traefik.http.routers.coder.entrypoints: https
      traefik.http.routers.coder.rule: Host(`coder.${HOST}`)
      traefik.http.routers.coder.tls.certresolver: resolver
      traefik.http.routers.coder.service: coder
      traefik.http.services.coder.loadbalancer.server.port: 7080
      traefik.http.routers.coder-wildcard.entrypoints: https
      traefik.http.routers.coder-wildcard.rule: HostRegexp(`${CODER_HOST_PATTERN}`)
      traefik.http.routers.coder-wildcard.tls.certresolver: resolver
      traefik.http.routers.coder-wildcard.tls.domains[0].main: coder.${HOST}
      traefik.http.routers.coder-wildcard.tls.domains[0].sans: '*.coder.${HOST}'
      traefik.http.routers.coder-wildcard.service: coder-wildcard
      traefik.http.services.coder-wildcard.loadbalancer.server.port: 7080
    user: ${PUID}:${PGID}
    group_add:
      - 986
  coder-postgres:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: coder-postgres
    volumes:
      - coder-postgres:/var/lib/postgresql
      - ${DATA_DIR}/postgres/coder:/docker-entrypoint-initdb.d
    secrets:
      - coder_postgres_password
    environment:
      POSTGRES_DB: coder
      POSTGRES_PASSWORD_FILE: /run/secrets/coder_postgres_password
      POSTGRES_USER: coder
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
volumes:
  coder-postgres:
    name: coder-postgres
secrets:
  coder_postgres_password:
    file: ../.secrets/coder_postgres_password
