name: 🤖 Merge Open PRs

on:
  workflow_dispatch:

jobs:
  merge-prs:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🤫 Creating GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            server-deployment-template
            ${{ github.event.repository.name }}

      - name: 🔀 Merge Open PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTO_MERGE_PR_MIN_DAYS: ${{ vars.AUTO_MERGE_PR_MIN_DAYS || '3' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "${{ github.event.repository.default_branch }}"
          git reset --hard "origin/${{ github.event.repository.default_branch }}"

          prs=$(gh pr list \
            --author "ben-pearce-renovate-homelab[bot]" \
            --state open \
            --json number,title,headRefName,mergeable,createdAt,statusCheckRollup \
            --jq '
              .[]
              | select(.mergeable == "MERGEABLE")
              | select(
                  (
                    any(
                      .statusCheckRollup[];
                      .context == "renovate/stability-days"
                      and (.state == "SUCCESS" or .conclusion == "SUCCESS")
                    )
                  )
                  and
                  (
                    ((now - (.createdAt | fromdateiso8601)) / 86400) >= '"${AUTO_MERGE_PR_MIN_DAYS}"'
                  )
                )
              | @base64
            ')

          echo "PRs selected:"
          echo "$prs" | while read -r pr; do
            echo "$pr" | base64 -d | jq '{number, title, headRefName}'
          done

          if [ -z "$prs" ]; then
            echo "No mergeable PRs found."
            exit 0
          fi

          merged=0

          while read -r pr; do
            json=$(echo "$pr" | base64 -d)

            number=$(echo "$json" | jq -r '.number')
            branch=$(echo "$json" | jq -r '.headRefName')

            echo "Merging PR #$number ($branch)..."

            git fetch origin "$branch:$branch"

            if git merge --no-ff --no-edit "$branch"; then
              merged=1
            else
              echo "Merge conflict in PR #$number, aborting merge."
              git merge --abort || true
            fi
          done <<< "$prs"

          if [ "$merged" = "1" ]; then
            git push origin "${{ github.event.repository.default_branch }}"
          fi